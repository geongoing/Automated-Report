name: Windows release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
permissions:
  contents: write
env:
  PYTHONUTF8: '1'
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test source
        run: python -B -m unittest discover -s tests -p "test_*.py" -v
      - name: Install build dependencies
        run: python -m pip install -r local-web/requirements-build.txt
      - name: Build release files
        shell: pwsh
        run: |
          $version = (Get-Content local-web/version.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) { throw 'Tag/version mismatch' }
          python -B scripts/build_release.py --tag $tag
      - name: Test standalone EXE
        run: python -B tests/frozen_smoke.py --exe dist/SongdoDaily.exe
      - name: Publish tested stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -B scripts/publish_release.py
